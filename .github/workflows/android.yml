name: Build APK

on:
  push:
    branches:
      - main  # 监听 main 分支的提交
  pull_request:
    branches:
      - main
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 授权 Gradle 执行权限
        run: chmod +x gradlew

      - name: 清理 Gradle 缓存
        run: ./gradlew clean

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --warning-mode all

      - name: 上传 Debug APK 作为构件
        uses: actions/upload-artifact@v4
        with:
          name: AppRetention-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: 编译 Release APK
        run: ./gradlew assembleRelease --warning-mode all

      - name: 上传 Release APK 作为构件
        uses: actions/upload-artifact@v4
        with:
          name: AppRetention-release
          path: app/build/outputs/apk/release/*.apk
