name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 设置 Gradle 缓存
        uses: gradle/gradle-build-action@v3

      - name: 设置 Gradle 权限
        run: chmod +x ./gradlew

      - name: 创建 local.properties（防止缺失）
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: 清理 Gradle 缓存
        run: ./gradlew clean

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --warning-mode all

      - name: 上传 Debug APK 作为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppRetention-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: 编译 Release APK
        env:
          KEYSTORE_FILE_B64: ${{ secrets.KEYSTORE_FILE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
        run: |
          # 解析 Keystore Base64 内容并写入文件
          echo "$KEYSTORE_FILE_B64" | base64 -d > keystore.jks

          # 创建 local.properties
          echo "keyStoreFile=keystore.jks" >> local.properties
          echo "keyStorePassword=$KEYSTORE_PASSWORD" >> local.properties
          echo "keyAlias=$KEY_ALIAS" >> local.properties
          echo "keyAliasPassword=$KEY_ALIAS_PASSWORD" >> local.properties

          # 编译 Release APK
          ./gradlew assembleRelease --warning-mode all

      - name: 上传 Release APK 作为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppRetention-release
          path: app/build/outputs/apk/release/*.apk
